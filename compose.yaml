name: buildshift
services:
  game:
    image: buildshift12-game:local
    build:
      context: .
      target: game
    environment:
      NODE_ENV: production
      GAME_SERVER_PORT: "2567"
      VIVES_LLM_API_KEY: ${VIVES_LLM_API_KEY:?Set VIVES_LLM_API_KEY in your private .env}
    init: true
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/api/ai-chat',{method:'OPTIONS'}).then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: buildshift12-web:local
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      game:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
