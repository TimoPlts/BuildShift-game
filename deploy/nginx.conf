map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
# Docker DNS must be refreshed when Compose replaces the backend container.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream game_backend {
    zone game_backend 64k;
    server game:2567 resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ @game;
    }
    # Colyseus matchmaking, API and dynamic /processId/roomId WebSocket paths.
    # No URI suffix here: the original request path must reach Colyseus intact.
    location @game {
        proxy_pass http://game_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
