packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed to run install-time build scripts (e.g. native binaries).
# pnpm blocks postinstall scripts by default; esbuild needs it for Vite/Vitest.
allowBuilds:
  esbuild: true
  # Optional native accelerator for msgpackr (used by the Colyseus protocol
  # layer); the pure-JS fallback works without it, so this is not required.
  msgpackr-extract: true
